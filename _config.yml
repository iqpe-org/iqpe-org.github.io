# --------------------------------------------------------------
# _config.yml — settings relevant to the homepage.
# Merge these keys into your site's existing _config.yml
# (created by `jekyll new-theme minimal-mistakes` or the
# minimal-mistakes-jekyll gem/remote theme starter).
# --------------------------------------------------------------

title: "Institute for Quantitative Political Economy"
title_separator: "—"
name: "The Institute for Quantitative Political Economy"
logo: "/assets/images/logo-no-text.png"
description: "Independent, nonpartisan research on the institutions that hold economies and societies together."
locale: "en-US"
url: "https://iqpe.org"

remote_theme: "mmistakes/minimal-mistakes"
# or, for the remote theme (GitHub Pages friendly):
# remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"   # your palette is applied via the custom-overrides.scss import instead

# Homepage
words_per_minute: 200
head_scripts:
  - https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap

navigation:
  - title: "Research"
    url: /research/
  - title: "Publications"
    url: /publications/
  - title: "Programs"
    url: /programs/
  - title: "Team"
    url: /team/
  - title: "About"
    url: /about/

footer:
  links:
    - label: "The Weekly Brief"
      url: /subscribe/
    - label: "Press"
      url: /press/
    - label: "Contact"
      url: /contact/

collections:
  team:
    output: true
    permalink: /team/:slug/

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-remote-theme